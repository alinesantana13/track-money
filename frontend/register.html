<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Track Money</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body class="auth-shell">
  <main class="center-card">
    <section class="panel form-panel">
      <span class="eyebrow">Primeiro acesso</span>
      <h1>Criar conta</h1>
      <p class="muted">Cadastre-se para testar o fluxo completo da aplicacao.</p>

      <form id="register-form" class="form-stack">
        <label class="field">
          <span>Nome</span>
          <input id="name" name="name" type="text" placeholder="Nome" required maxlength="128">
        </label>

        <label class="field">
          <span>Email</span>
          <input id="email" name="email" type="email" placeholder="email" required>
        </label>

        <label class="field">
          <span>Senha</span>
          <input id="password" name="password" type="password" placeholder="Minimo 8 caracteres" required minlength="8">
        </label>

        <p id="form-error" class="inline-error" hidden></p>

        <button id="submit-button" class="button primary" type="submit">Cadastrar</button>
      </form>

      <p class="helper-text">
        Ja possui conta?
        <a href="./login.html">Entrar</a>
      </p>
    </section>
  </main>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/pages/register.js"></script>
</body>
</html>
