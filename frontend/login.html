<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Track Money</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body class="auth-shell">
  <main class="center-card">
    <section class="panel form-panel">
      <span class="eyebrow">Autenticacao</span>
      <h1>Entrar</h1>
      <p class="muted">Use seu email e senha para acessar o dashboard.</p>

      <form id="login-form" class="form-stack">
        <label class="field">
          <span>Email</span>
          <input id="email" name="email" type="email" placeholder="email" required>
        </label>

        <label class="field">
          <span>Senha</span>
          <input id="password" name="password" type="password" placeholder="********" required minlength="8">
        </label>

        <p id="form-error" class="inline-error" hidden></p>

        <button id="submit-button" class="button primary" type="submit">Entrar</button>
      </form>

      <p class="helper-text">
        Ainda nao tem conta?
        <a href="./register.html">Criar agora</a>
      </p>
    </section>
  </main>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="./config.js"></script>
  <script type="module" src="./js/pages/login.js"></script>
</body>
</html>
